<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>404 · Janre Puuorg</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<script>try{var a=localStorage.getItem("jp-accent");if(a&&a!=="cyan")document.documentElement.setAttribute("data-accent",a)}catch(e){}</script>
<style>
:root { color-scheme: dark; --bg: #0a0f1c; --surface: #111a2c; --line: #22304b; --fg: #e7ecf4; --muted: #93a1b8; --accent: #4fd6e8; --ok: #5fd39a; --no: #ef8a7c;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
:root[data-accent="amber"] { --accent: #f0b04c; }
:root[data-accent="violet"] { --accent: #a99bff; }
:root[data-accent="rose"] { --accent: #ff8fb8; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--mono); display: grid; place-items: center; padding: 24px 16px; }
.win { width: min(640px, 100%); border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; box-shadow: 0 30px 60px -40px var(--accent); }
.bar { display: flex; align-items: center; gap: 12px; padding: 9px 14px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 0.78rem; }
.bar i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); display: inline-block; margin-right: 6px; }
.body { padding: 22px 20px 26px; font-size: 0.95rem; line-height: 1.8; overflow-wrap: anywhere; }
p { margin: 0; }
.ps { color: var(--ok); }
.err { color: var(--no); }
.big { font-size: clamp(3rem, 14vw, 5rem); font-weight: 500; color: var(--accent); line-height: 1; margin: 6px 0 16px; letter-spacing: -0.04em; }
.ls { display: flex; flex-wrap: wrap; gap: 4px 22px; margin: 2px 0 10px; }
a { color: var(--accent); text-underline-offset: 3px; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.cursor { display: inline-block; width: .55em; height: 1.05em; background: var(--accent); vertical-align: text-bottom; animation: b 1.1s steps(1) infinite; }
@keyframes b { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
</style>
</head>
<body>
<main class="win">
  <div class="bar"><span><i></i><i></i><i></i></span><span>janre@janre.ee: ~</span></div>
  <div class="body">
    <p class="big">404</p>
    <p><span class="ps">janre@janre.ee</span>:~$ cd <span id="path">/see-leht</span></p>
    <p class="err">bash: cd: <span id="path2">/see-leht</span>: No such file or directory</p>
    <p><span class="ps">janre@janre.ee</span>:~$ ls</p>
    <p class="ls"><a href="/">avaleht/</a><a href="/#projektid">projektid/</a><a href="/#kontakt">kontakt/</a><a href="/Janre_Puuorg_CV.pdf">Janre_Puuorg_CV.pdf</a></p>
    <p><span class="ps">janre@janre.ee</span>:~$ <span class="cursor" aria-hidden="true"></span></p>
  </div>
</main>
<script>
(function () {
  var p = decodeURIComponent(location.pathname || '/see-leht');
  if (p.length > 60) p = p.slice(0, 57) + '...';
  document.getElementById('path').textContent = p;
  document.getElementById('path2').textContent = p;
})();
</script>
</body>
</html>
